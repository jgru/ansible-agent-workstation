---
- name: Install mcp-dblp
  ansible.builtin.command: uv tool install mcp-dblp
  args:
    creates: ~/.local/bin/mcp-dblp
  register: dblp_install
  until: dblp_install is succeeded
  retries: 3
  delay: 15

- name: Check the local DBLP index
  ansible.builtin.command: mcp-dblp-index status
  register: dblp_index
  changed_when: false

- name: Download the DBLP index (1.3 GB, unpacks to 4.2 GB)
  ansible.builtin.command: mcp-dblp-index fetch
  when:
    - dblp_prefetch_index | bool
    - "'no current index' in dblp_index.stdout ~ dblp_index.stderr"
  changed_when: true
  async: 3600
  poll: 15

- name: Fetch the Google Scholar server
  ansible.builtin.git:
    repo: https://github.com/JackKuo666/Google-Scholar-MCP-Server.git
    dest: "{{ google_scholar_dir }}"
    version: "{{ google_scholar_version }}"
  register: google_scholar_clone
  until: google_scholar_clone is succeeded
  retries: 3
  delay: 15

# The repo's .python-version asks for 3.10; Debian's Python works and saves a download.
- name: Create the Google Scholar virtualenv
  ansible.builtin.command: uv venv --python /usr/bin/python3 .venv
  args:
    chdir: "{{ google_scholar_dir }}"
    creates: .venv/bin/python

- name: Install the Google Scholar server's dependencies
  ansible.builtin.command:
    argv: "{{ ['uv', 'pip', 'install', '--python', '.venv/bin/python', '-r', 'requirements.txt'] + google_scholar_pins }}"
    chdir: "{{ google_scholar_dir }}"
  register: google_scholar_deps
  changed_when: "'Installed' in google_scholar_deps.stderr"
  until: google_scholar_deps is succeeded
  retries: 3
  delay: 15

- name: Check what Claude Code has registered
  ansible.builtin.command: "claude mcp get {{ item.name }}"
  loop: "{{ mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"
  register: claude_mcp
  changed_when: false
  failed_when: false

- name: Register the servers with Claude Code
  ansible.builtin.command:
    argv: "{{ ['claude', 'mcp', 'add', '--scope', 'user', item.item.name, '--', item.item.command] + item.item.args }}"
  loop: "{{ claude_mcp.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0
  changed_when: true

- name: Check what Codex has registered
  ansible.builtin.command: "codex mcp get {{ item.name }}"
  loop: "{{ mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"
  register: codex_mcp
  changed_when: false
  failed_when: false

- name: Register the servers with Codex
  ansible.builtin.command:
    argv: "{{ ['codex', 'mcp', 'add', item.item.name, '--', item.item.command] + item.item.args }}"
  loop: "{{ codex_mcp.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0
  changed_when: true
